name: 🦞 Submit a Project
description: Suggest a project for the directory
title: "[Project] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Share an agent someone can run. We check its setup guide and example task before listing it.
  - type: input
    id: name
    attributes:
      label: Project Name
      placeholder: ZeroClaw
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: GitHub URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website (optional)
      placeholder: https://zeroclaw.dev
  - type: dropdown
    id: language
    attributes:
      label: Primary Language
      options:
        - TypeScript
        - Rust
        - Python
        - Go
        - C
        - Bash
        - JavaScript
        - Kotlin
        - Zig
        - Multi / Other
    validations:
      required: true
  - type: textarea
    id: quick_start
    attributes:
      label: Upstream setup guide
      description: Link to the instructions a newcomer can follow.
    validations:
      required: true
  - type: textarea
    id: first_task
    attributes:
      label: Give us one task the agent can carry out
    validations:
      required: true
  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: What can someone ask the agent to do?
      placeholder: "Organize notes in a local folder"
    validations:
      required: true
  - type: textarea
    id: highlight
    attributes:
      label: What makes it unique?
      placeholder: "Links to the source notes so you can check its work"
    validations:
      required: true
